name: tests

on:
  push:
    paths:
      - "threat-intel-crowdstrike/**"
  pull_request:
    paths:
      - "threat-intel-crowdstrike/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: threat-intel-crowdstrike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
